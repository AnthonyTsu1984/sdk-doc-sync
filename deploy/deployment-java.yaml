# deploy/deployment-java.yaml — java-worker（S2 双 pod 之二）。
#
# 与 deployment-python.yaml 同构，差异仅：名字/PVC/LANGUAGE/SDK_REPO。
# slot 表：slot 1 = v3.0.x（scanStateKey java-v30，注册表派生键）、
# slot 2 = v2.6.x（java-v26）。BASE_TOKEN 同样由 bootstrap 从 release-tracks.json
# 自动导出，无需操作员补 env。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-worker
  namespace: sdk-doc-sync
  labels:
    app.kubernetes.io/part-of: sdk-doc-sync
    app.kubernetes.io/name: java-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: java-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-worker
        app.kubernetes.io/part-of: sdk-doc-sync
    spec:
      containers:
        - name: worker
          image: node:22-bookworm
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/scripts/bootstrap.sh"]
          workingDir: /workspace
          env:
            - name: LANGUAGE
              value: java
            # 停门等人批的宽限：人工门节奏是小时级——900s 会让战役每 ~17 分钟重派
            # 重推导并重发门铃（2026-10-24 首战 2 小时 22 条刷屏的根因）。6h 无人批才让出。
            - name: CAMPAIGN_GRACE_SECS
              value: "21600"
            - name: SDK_REPO
              value: milvus-sdk-java
            - name: TRACKS
              value: "v3.0.x,v2.6.x"
            - name: OPENCODE_PROVIDER_KEY
              value: custom
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: sdk-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: scripts
              mountPath: /opt/scripts
              readOnly: true
            - name: backlog
              mountPath: /opt/backlog
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-java
        - name: scripts
          configMap:
            name: sdk-scripts
            defaultMode: 0755
        - name: backlog
          configMap:
            name: sdk-backlog
