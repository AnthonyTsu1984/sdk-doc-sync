<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务看板 · feishu-markdown-bridge</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c1e21; --dim: #6b7280;
    --line: #e4e6ea; --blue: #2563eb; --amber: #b45309; --red: #b91c1c; --green: #15803d;
    --blue-bg: #eff4ff; --amber-bg: #fdf3e3; --red-bg: #fdeaea; --green-bg: #e9f7ee; --dim-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 22px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--dim-bg); color: var(--dim); font-size: 12.5px; }
  .chip.ok { background: var(--green-bg); color: var(--green); }
  .chip.warn { background: var(--amber-bg); color: var(--amber); }
  .chip.bad { background: var(--red-bg); color: var(--red); }
  .chip a { color: inherit; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  .dot.live { background: var(--green); }
  .dot.dead { background: var(--red); }
  main { padding: 18px 22px 60px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 13px; color: var(--dim); text-transform: none; margin: 20px 0 10px; font-weight: 600; letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; cursor: pointer; transition: box-shadow .12s; }
  .card:hover { box-shadow: 0 2px 10px rgba(16,24,40,.08); }
  .card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .title { font-weight: 600; font-size: 14.5px; }
  .card .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.active { background: var(--blue-bg); color: var(--blue); }
  .badge.awaiting-close { background: var(--amber-bg); color: var(--amber); }
  .badge.zombie { background: var(--red-bg); color: var(--red); }
  .badge.finalized { background: var(--green-bg); color: var(--green); }
  .bar { height: 6px; border-radius: 4px; background: var(--dim-bg); margin: 10px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); font-size: 12.5px; }
  .sentinel { cursor: default; }
  .sentinel .sched { font-size: 12.5px; color: var(--dim); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin-top: 8px; }
  .kv b { color: var(--dim); font-weight: 500; }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 7px; }
  .empty { color: var(--dim); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; background: var(--card); }
  .matrix { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 15px; }
  .mrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mlang { width: 64px; font-weight: 600; font-size: 13px; flex: none; }
  .mtrack { cursor: pointer; padding: 3px 11px; border-radius: 8px; font-size: 12.5px; }
  .mtrack.active { background: var(--blue-bg); color: var(--blue); }
  .mtrack.awaiting-close { background: var(--amber-bg); color: var(--amber); }
  .mtrack.zombie { background: var(--red-bg); color: var(--red); }
  .mtrack.finalized { background: var(--green-bg); color: var(--green); }
  .badge.gate { background: #f5edff; color: #6d28d9; }
  .actions { margin-top: 9px; display: flex; gap: 8px; }
  .act { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--ink); }
  .act:hover { border-color: var(--blue); color: var(--blue); }
  .feed { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; max-height: 320px; overflow-y: auto; }
  .feed .ev { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .feed .ev:last-child { border-bottom: 0; }
  .feed .t { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feed .k { white-space: nowrap; background: var(--dim-bg); color: var(--dim); border-radius: 6px; padding: 0 7px; font-size: 11.5px; }
  .feed .k.start { background: var(--green-bg); color: var(--green); }
  .feed .k.Bash, .feed .k.Write, .feed .k.Edit { background: var(--blue-bg); color: var(--blue); }
  .feed .k.Agent, .feed .k.Task { background: var(--amber-bg); color: var(--amber); }
  .feed .s { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .c { white-space: nowrap; color: var(--dim); font-size: 11.5px; }
  #drawer { position: fixed; top: 0; right: -560px; width: 540px; max-width: 92vw; height: 100vh; background: var(--card); border-left: 1px solid var(--line); box-shadow: -6px 0 24px rgba(16,24,40,.12); transition: right .18s ease; z-index: 20; display: flex; flex-direction: column; }
  #drawer.open { right: 0; }
  #drawer .head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  #drawer .head .t { font-weight: 600; }
  #drawer .body { padding: 14px 18px 40px; overflow-y: auto; }
  #drawer h3 { font-size: 12.5px; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
  #drawer ul { margin: 4px 0; padding-left: 18px; }
  #drawer li { margin: 3px 0; word-break: break-all; }
  .x { cursor: pointer; border: 0; background: var(--dim-bg); color: var(--dim); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .copy { cursor: pointer; border: 0; background: none; color: var(--blue); padding: 0; font-size: 12px; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .warnline { color: var(--red); font-size: 12.5px; margin: 6px 0; }
  footer { color: var(--dim); font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<header>
  <h1>任务看板</h1>
  <span class="chip" id="admission">准入 …</span>
  <span class="chip" id="gate">呈门 …</span>
  <span class="chip" id="conn"><span class="dot" id="connDot"></span><span id="connText">连接 …</span></span>
  <span class="chip" id="generated">—</span>
</header>
<main>
  <h2>哨兵 · 每日自动扫描（只发现不处置）</h2>
  <div class="grid" id="sentinels"></div>
  <h2>并行矩阵（语种 × 轨道）</h2>
  <div id="matrix" class="matrix"></div>
  <h2>战役任务</h2>
  <div class="grid" id="campaigns"></div>
  <h2>活动流（会话动作事件，近 24–48h）</h2>
  <div id="activity" class="feed"></div>
  <footer>只读看板：全部字段派生自盘上治理状态，本页无任何写路径。文件材料经 /api/file 白名单查看。</footer>
</main>

<div id="drawer">
  <div class="head"><span class="t" id="dTitle"></span><button class="x" onclick="closeDrawer()">关闭</button></div>
  <div class="body" id="dBody"></div>
</div>

<script>
'use strict';
let latest = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rel = (iso) => {
  if (!iso) return '—';
  const ms = Date.now() - new Date(iso).getTime();
  if (Number.isNaN(ms)) return '—';
  const m = Math.round(ms / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.round(m / 60);
  if (h < 48) return h + ' 小时前';
  return Math.round(h / 24) + ' 天前';
};
const fmt = (iso) => (iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }) : '—');
const viewLink = (p, label) => p
  ? `<a href="/api/file?path=${encodeURIComponent(p)}" target="_blank">${esc(label ?? p)}</a>`
  : '<span style="color:var(--dim)">无</span>';
const HEALTH_LABEL = { active: '进行中', 'awaiting-close': '◐ 待收口', zombie: '⚠ 僵尸会话', finalized: '已收官' };

function renderHeader(d) {
  const fp = d.admission && d.admission.fingerprint;
  const adm = document.getElementById('admission');
  if (!fp || fp.status === 'pending') {
    adm.className = 'chip'; adm.textContent = `准入 台账 ${d.admission?.ledgerEntryCount ?? 0} 条 · 指纹计算中…`;
  } else if (fp.matchesLedger === true) {
    adm.className = 'chip ok';
    adm.textContent = `准入 ADMITTED（${fp.phase ?? '?'} · 指纹 ${String(fp.fingerprint ?? '').slice(7, 19)}…）`;
  } else if (fp.matchesLedger === false) {
    adm.className = 'chip bad';
    adm.textContent = `准入 未匹配（台账最新 ${d.admission?.lastEntry?.phase ?? '?'} vs 当前树指纹）`;
  } else {
    adm.className = 'chip'; adm.textContent = `准入 台账 ${d.admission?.ledgerEntryCount ?? 0} 条（无指纹比对）`;
  }
  const gate = document.getElementById('gate');
  const g = d.admission && d.admission.gatePresentation;
  if (g && g.present) {
    gate.className = 'chip warn';
    gate.innerHTML = `<a href="/api/file?path=${encodeURIComponent(g.path)}" target="_blank">呈门材料待审 →</a>`;
  } else {
    gate.className = 'chip'; gate.textContent = '呈门 无待审';
  }
  document.getElementById('generated').textContent = '生成于 ' + fmt(d.generatedAt);
}

function renderSentinels(d) {
  const host = document.getElementById('sentinels');
  if (!d.sentinels || !d.sentinels.length) { host.innerHTML = '<div class="empty">无自动化任务</div>'; return; }
  host.innerHTML = d.sentinels.map((s) => {
    const badge = s.status === 'ok' ? '<span class="badge active">正常</span>'
      : s.status === 'stale' ? '<span class="badge zombie">⚠ 超 25h 未运行</span>'
      : '<span class="badge finalized">从未运行</span>';
    const cursor = s.cursor
      ? `PR 游标 #${s.cursor.lastPrNumber ?? '?'} · 待跟进 tag ${Object.keys(s.cursor.lastTags || {}).length ? esc(JSON.stringify(s.cursor.lastTags)) : '无'}`
      : '游标未落盘';
    return `<div class="card sentinel">
      <div class="row1"><span class="title">${esc(s.title)}</span>${badge}</div>
      <div class="sched">${esc(s.schedule)} · 上次 ${rel(s.lastRunAt)} · 下次 ${fmt(s.nextRunAt)}</div>
      <div class="kv">
        <b>游标</b><span>${cursor}</span>
        <b>工件</b><span>${s.artifactsPresent ? viewLink(s.artifactsDir + '/', 'tmp/sdk-release-scout/daily/') : '无'}</span>
      </div>
      <div class="note">红线：只发现不处置——推进 scan-state / 写 Feishu / dry-run 一律走人工门。</div>
    </div>`;
  }).join('');
}

function attachKey(c) { return c.scanState.key || c.sessionPath; }

function renderMatrix(d) {
  const host = document.getElementById('matrix');
  const list = d.campaigns || [];
  if (!list.length) { host.innerHTML = ''; return; }
  const byLanguage = new Map();
  list.forEach((c, i) => {
    const lang = c.language || '?';
    if (!byLanguage.has(lang)) byLanguage.set(lang, []);
    byLanguage.get(lang).push([c, i]);
  });
  const rows = [...byLanguage.entries()].map(([lang, entries]) => {
    const chips = entries.map(([c, i]) => `<span class="mtrack ${c.health}" title="${esc(c.sessionPath)}" onclick="openDrawer(${i})">${esc(c.track ?? '?')}${c.nextGate ? ' ⛩' : ''}${c.lastActivityAt ? ' ●' : ''}</span>`).join('');
    return `<div class="mrow"><span class="mlang">${esc(lang)}</span>${chips}</div>`;
  }).join('');
  host.innerHTML = rows + '<div class="note" style="border:0;padding:0;margin-top:6px">⛩=有当前门 ●=近期有活动；点击轨道打开战役详情。新会话接管战役：粘贴 <code>/attach &lt;键&gt;</code>（键如 java-v30）。</div>';
}

async function spawnSession() {
  try {
    const r = await fetch('/api/spawn-session', { method: 'POST' });
    const j = await r.json();
    alert(j.note || j.error || JSON.stringify(j));
  } catch (e) { alert('派会话失败: ' + e); }
}

function renderCampaigns(d) {
  const host = document.getElementById('campaigns');
  const list = d.campaigns || [];
  if (!list.length) { host.innerHTML = '<div class="empty">无战役会话（新战役从 dry-run + --session-state 开始）</div>'; return; }
  const spawnOn = Boolean(d.features && d.features.spawnEnabled);
  host.innerHTML = list.map((c, i) => {
    const pct = c.units ? Math.round((c.accepted / c.units) * 100) : 0;
    const flags = [
      c.pending ? `挂起执行 ${c.pending}` : '',
      c.hasActiveExecution ? '执行中' : '',
      c.hasActiveRollback ? '回滚中' : '',
      c.rollbacks ? `回滚 ${c.rollbacks}` : '',
    ].filter(Boolean).join(' · ');
    const gateChip = c.nextGate
      ? `<span class="badge gate" title="${esc(c.nextGate.reviewUnitId || '')}">门 ${esc(c.nextGate.gate)}</span>`
      : '';
    const zombieLine = c.health === 'zombie'
      ? `<div class="warnline">⚠ scan-state 已推进到 ${esc(c.scanState.lastScannedTag ?? '?')}（越过目标 ${esc(c.scanState.targetTag ?? '?')}）——close-session 收口，勿续跑</div>` : '';
    const key = attachKey(c);
    return `<div class="card" data-i="${i}" onclick="openDrawer(${i})">
      <div class="row1">
        <span class="title">${esc(c.language ?? '?')} · ${esc(c.track ?? '?')}${c.acceptanceFlow ? ` · ${esc(c.acceptanceFlow)}` : ''}</span>
        <span style="display:flex;gap:6px">${gateChip}<span class="badge ${c.health}">${HEALTH_LABEL[c.health] ?? esc(c.status)}</span></span>
      </div>
      <div class="sub">${esc(c.sessionId ? c.sessionId.split(':').slice(0, 4).join(':') : c.sessionPath)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta">
        <span>单元 ${c.accepted}/${c.units}</span>
        <span>更新 ${rel(c.updatedAt)}</span>
        <span>${esc(c.scanState.key ?? '')}${c.scanState.lastScannedTag ? ` @ ${esc(c.scanState.lastScannedTag)}` : ''}</span>
        ${c.lastActivityAt ? `<span style="color:var(--green)">活动 ${rel(c.lastActivityAt)}${c.activityCount ? ` · ${c.activityCount} 步` : ''}</span>` : ''}
        ${flags ? `<span>${esc(flags)}</span>` : ''}
      </div>
      ${zombieLine}
      <div class="actions" onclick="event.stopPropagation()">
        <button class="act" onclick="copyText('/attach ${esc(key)}')">复制 /attach</button>
        ${spawnOn ? '<button class="act" onclick="spawnSession()">派会话</button>' : ''}
      </div>
    </div>`;
  }).join('');
}

function renderActivity(d) {
  const host = document.getElementById('activity');
  const events = (d.activity || []).slice(-50).reverse();
  if (!events.length) { host.innerHTML = '<div class="empty">暂无事件——批 2 钩子注册后，新开的会话动作会实时出现在这里（当前会话的钩子配置在启动时快照，需新会话生效）。</div>'; return; }
  const cardTitle = new Map((d.campaigns || []).map((c) => [c.sessionPath, `${c.language} · ${c.track}`]));
  host.innerHTML = events.map((e) => {
    const time = new Date(e.ts);
    const hh = String(time.getHours()).padStart(2, '0');
    const mm = String(time.getMinutes()).padStart(2, '0');
    const label = e.kind === 'session-start' ? 'Start' : (e.tool || '?');
    const klass = e.kind === 'session-start' ? 'start' : label;
    return `<div class="ev">
      <span class="t">${hh}:${mm}</span>
      <span class="k ${esc(klass)}">${esc(label)}</span>
      <span class="s" title="${esc(e.summary)}">${esc(e.summary || '—')}</span>
      ${e.campaign && cardTitle.has(e.campaign) ? `<span class="c">→ ${esc(cardTitle.get(e.campaign))}</span>` : ''}
    </div>`;
  }).join('');
}

function render(d) {
  latest = d;
  renderHeader(d);
  renderSentinels(d);
  renderMatrix(d);
  renderCampaigns(d);
  renderActivity(d);
  if (document.getElementById('drawer').classList.contains('open') && window._openIndex != null) {
    fillDrawer(window._openIndex);
  }
}

function copyText(t) { navigator.clipboard?.writeText(t); }

function fillDrawer(i) {
  const c = latest.campaigns[i];
  if (!c) return;
  document.getElementById('dTitle').innerHTML = `${esc(c.language)} · ${esc(c.track)} <span class="badge ${c.health}">${HEALTH_LABEL[c.health] ?? esc(c.status)}</span>`;
  const docs = c.documentLinks.length
    ? c.documentLinks.map((l) => `<li><a href="${esc(l)}" target="_blank">${esc(l)}</a></li>`).join('')
    : '<li>无</li>';
  const records = c.recordLinks.length
    ? c.recordLinks.map((l) => `<li><a href="${esc(l)}" target="_blank">${esc(l)}</a></li>`).join('')
    : '<li>无</li>';
  const journals = c.journalPaths.length
    ? c.journalPaths.map((p) => `<li>${viewLink(p)}</li>`).join('')
    : '<li>无</li>';
  document.getElementById('dBody').innerHTML = `
    <h3>会话文件</h3>
    <div>${viewLink(c.sessionPath, c.sessionPath)} <button class="copy" onclick='copyText(${JSON.stringify(c.sessionPath).replace(/'/g, "&#39;")})'>复制路径</button></div>
    <div class="kv" style="margin-top:6px">
      <b>sessionId</b><span style="word-break:break-all">${esc(c.sessionId ?? '—')}</span>
      <b>SDK</b><span>${esc(c.sdkName ?? '—')}</span>
      <b>状态机</b><span>${esc(c.status)}</span>
      <b>创建 / 更新</b><span>${fmt(c.createdAt)} / ${fmt(c.updatedAt)}</span>
      ${c.closedAt ? `<b>收口</b><span>${fmt(c.closedAt)}</span>` : ''}
    </div>
    <h3>scan-state 对照</h3>
    <div class="kv">
      <b>键</b><span>${esc(c.scanState.key ?? '—')}</span>
      <b>已推进</b><span>${esc(c.scanState.lastScannedTag ?? '—')}</span>
      <b>会话目标</b><span>${esc(c.scanState.targetTag ?? '—')}</span>
    </div>
    ${c.scanState.advancedPast === true ? '<div class="warnline">⚠ 僵尸会话：该轨已收官未终态化，close-session 收口，不要续跑。</div>' : ''}
    <h3>进度</h3>
    <div class="kv">
      <b>单元</b><span>${c.accepted}/${c.units} 已接受 · 挂起执行 ${c.pending}</span>
      <b>执行/回滚</b><span>${c.hasActiveExecution ? '执行中 ' : ''}${c.hasActiveRollback ? '回滚中 ' : ''}${c.rollbacks ? `历史回滚 ${c.rollbacks}` : '无活动执行/回滚'}</span>
      <b>当前门</b><span>${c.nextGate ? `<b style="color:#6d28d9">${esc(c.nextGate.gate)}</b>${c.nextGate.reviewUnitId ? ` · ${esc(c.nextGate.reviewUnitId)}` : ''}${c.nextGate.gate === 'CLOSE_SESSION' ? '（机械收口）' : ''}` : '—（由 sdk-review-session status 推导，稍候或无）'}</span>
    </div>
    <div style="margin-top:8px"><button class="act" onclick="copyText('/attach ${esc(attachKey(c))}')">复制 /attach ${esc(attachKey(c))}</button></div>
    <h3>工件</h3>
    <ul>
      <li>releaseScope: ${viewLink(c.artifacts.releaseScope)}</li>
      <li>referenceContext: ${viewLink(c.artifacts.referenceContext)}</li>
      <li>summaryJson: ${viewLink(c.artifacts.summaryJson)}</li>
    </ul>
    <h3>执行 journal</h3>
    <ul>${journals}</ul>
    <h3>文档（已接受单元）</h3>
    <ul>${docs}</ul>
    <h3>记录</h3>
    <ul>${records}</ul>`;
}

function openDrawer(i) { window._openIndex = i; fillDrawer(i); document.getElementById('drawer').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); window._openIndex = null; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

function connect() {
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  const es = new EventSource('/api/events');
  es.addEventListener('cards', (e) => {
    dot.className = 'dot live'; text.textContent = '实时';
    try { render(JSON.parse(e.data)); } catch {}
  });
  es.onopen = () => { dot.className = 'dot live'; text.textContent = '实时'; };
  es.onerror = () => { dot.className = 'dot dead'; text.textContent = '断开（轮询兜底）'; };
}
connect();
setInterval(async () => {
  try { render(await (await fetch('/api/cards')).json()); } catch {}
}, 30000);
fetch('/api/cards').then((r) => r.json()).then(render).catch(() => {});
</script>
</body>
</html>
