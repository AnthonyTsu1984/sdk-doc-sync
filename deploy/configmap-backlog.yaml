# deploy/configmap-backlog.yaml — S2 双 pod 种账本用的 per-language backlog。
#
# 数据来源（机械提取，可复算）：从主树账本
# tmp/api-reference-sync/daily-scan/pr-findings.jsonl（批 17 扫描产物，快照日
# 2026-10-24）用 `node deploy/lib.js extract-backlog --ledger … --language <lang>
# --discovered-on 2026-10-24` 提取该语言 pending 条目：
#   - python 6 条（#1184 #1188 #1191 #1198 #1199 #1207）
#   - java   8 条（#1174 #1175 #1178 #1186 #1190 #1198 #1200 #1204）
# 口径：discovered 事件且 languages 含目标语言、同 prNumber 的 languages 取并集
# （#1198 是 go/java/node/python 四语联合条目）；已 disposed 的 #1173/#1181 排除；
# discoveredOn 统一快照日 2026-10-24。字段：prNumber/languages/title/url/mergedAt。
#
# 消费方：deploy/configmap-scripts.yaml 的 seed-backlog.sh —— 挂载点 /opt/backlog，
# `daily-scan.js --import-backlog --file /opt/backlog/<lang>.jsonl` 幂等入账。
apiVersion: v1
kind: ConfigMap
