name: Documentation Skill Admission

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agent-team/**'
      - 'evals/skills/**'
      - 'scripts/run-skill-*.js'
      - 'scripts/validate-skills.js'
      - 'scripts/check-invariant-coverage.js'
      - 'tests/skills/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skill-admission.yml'
  workflow_dispatch:
    inputs:
      rollout_phase:
        description: Stable label for the admission evidence directory
        required: true
        default: manual

jobs:
  admission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LLM_API_KEY: ${{ secrets.SKILL_EVAL_API_KEY }}
      LLM_BASE_URL: ${{ secrets.SKILL_EVAL_BASE_URL }}
      LLM_MODEL: ${{ vars.SKILL_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The admission toolchain floor (scripts/admission/toolchain-manifest.json)
      # requires javac >= 17 for the doc-code-verify Java fragment gate; pin the
      # toolchain explicitly instead of relying on the runner image.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      # Model evals need the isolated credentials and cost real tokens/time, so
      # they run only on manual dispatch; pull_request runs the deterministic
      # stage alone via --deterministic-only.
      - name: Require isolated model-eval credentials
        if: github.event_name == 'workflow_dispatch'
        run: test -n "$LLM_API_KEY"
      - name: Run complete admission gate
        env:
          ROLLOUT_PHASE: ${{ github.event.inputs.rollout_phase || format('pr-{0}', github.event.pull_request.number) }}
          ADMISSION_ARGS: ${{ github.event_name == 'pull_request' && '--deterministic-only' || '' }}
        run: npm run admit:skills -- --phase "$ROLLOUT_PHASE" $ADMISSION_ARGS
      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-admission-${{ github.run_id }}
          path: tmp/skill-feedback-rollout/**
          if-no-files-found: error
          retention-days: 30

# Live smoke commands are intentionally absent. Disposable tenant creation,
# patch, acceptance, and cleanup remain separate digest-approved operator gates.
