<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>治理看板 · feishu-markdown-bridge</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c1e21; --dim: #6b7280;
    --line: #e4e6ea; --blue: #2563eb; --amber: #b45309; --red: #b91c1c; --green: #15803d;
    --violet: #6d28d9;
    --blue-bg: #eff4ff; --amber-bg: #fdf3e3; --red-bg: #fdeaea; --green-bg: #e9f7ee; --dim-bg: #eef0f3; --violet-bg: #f5edff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 22px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; white-space: nowrap; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; }
  nav a { padding: 4px 12px; border-radius: 8px; color: var(--dim); font-size: 13.5px; text-decoration: none; }
  nav a:hover { background: var(--dim-bg); color: var(--ink); }
  nav a.on { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
  .hspace { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--dim-bg); color: var(--dim); font-size: 12.5px; }
  .chip.ok { background: var(--green-bg); color: var(--green); }
  .chip.warn { background: var(--amber-bg); color: var(--amber); }
  .chip.bad { background: var(--red-bg); color: var(--red); }
  .chip a { color: inherit; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  .dot.live { background: var(--green); }
  .dot.dead { background: var(--red); }
  main { padding: 16px 22px 60px; max-width: 1280px; margin: 0 auto; }
  .crumbs { font-size: 12.5px; color: var(--dim); margin: 2px 0 10px; }
  .crumbs a { color: var(--dim); }
  .crumbs a:hover { color: var(--blue); }
  .crumbs b { color: var(--ink); font-weight: 600; }
  h2 { font-size: 13px; color: var(--dim); margin: 20px 0 10px; font-weight: 600; letter-spacing: .02em; }
  h2:first-child, .crumbs + h2 { margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; transition: box-shadow .12s; }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { box-shadow: 0 2px 10px rgba(16,24,40,.08); }
  .card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .title { font-weight: 600; font-size: 14.5px; }
  .card .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.active { background: var(--blue-bg); color: var(--blue); }
  .badge.awaiting-close { background: var(--amber-bg); color: var(--amber); }
  .badge.zombie { background: var(--red-bg); color: var(--red); }
  .badge.finalized { background: var(--green-bg); color: var(--green); }
  .badge.gate { background: var(--violet-bg); color: var(--violet); cursor: pointer; }
  .bar { height: 6px; border-radius: 4px; background: var(--dim-bg); margin: 10px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); font-size: 12.5px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin-top: 8px; }
  .kv b { color: var(--dim); font-weight: 500; }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 7px; }
  .empty { color: var(--dim); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; background: var(--card); }
  .sentinel { cursor: default; }
  .sentinel .sched { font-size: 12.5px; color: var(--dim); }
  .inbox { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .inbox .item { display: flex; align-items: center; gap: 12px; padding: 10px 15px; border-bottom: 1px solid var(--line); }
  .inbox .item:last-child { border-bottom: 0; }
  .inbox .what { flex: 1; min-width: 0; }
  .inbox .what .t { font-weight: 600; font-size: 13.5px; }
  .inbox .what .d { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inbox .go { cursor: pointer; border: 0; background: var(--blue); color: #fff; border-radius: 8px; padding: 6px 14px; font-size: 13px; white-space: nowrap; }
  .inbox .go.ghost { background: var(--card); color: var(--blue); border: 1px solid var(--blue); }
  .inbox .go.ghost:hover { background: var(--blue-bg); }
  table.tbl { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  .tbl th { text-align: left; font-size: 12px; color: var(--dim); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fafbfc; white-space: nowrap; }
  .tbl td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr.rowlink { cursor: pointer; }
  .tbl tbody tr.rowlink:hover { background: #f7f9fc; }
  .tbl .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl .dim { color: var(--dim); }
  .tbl .fname { font-weight: 500; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .filters .f { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--dim); }
  .filters .f.on { background: var(--blue-bg); color: var(--blue); border-color: #c7d7fb; }
  .act { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--ink); }
  .act:hover { border-color: var(--blue); color: var(--blue); }
  .act.primary { background: var(--violet); border-color: var(--violet); color: #fff; font-size: 13px; padding: 6px 16px; }
  .act.primary:hover { opacity: .9; color: #fff; }
  .act.primary:disabled { opacity: .45; cursor: not-allowed; }
  .act.danger { border-color: #ddd0f7; color: var(--violet); }
  .langcard select { width: 100%; margin-top: 9px; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--card); color: var(--ink); }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  .steps .st { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; background: var(--dim-bg); color: var(--dim); }
  .steps .st.done { background: var(--green-bg); color: var(--green); }
  .steps .st.cur { background: var(--blue-bg); color: var(--blue); font-weight: 600; box-shadow: inset 0 0 0 1px #c7d7fb; }
  .steps .arr { color: var(--dim); font-size: 11px; }
  .approve { margin: 10px 0; border: 1px solid #e6dcfa; background: #faf7ff; border-radius: 10px; padding: 12px 14px; }
  .approve .t { font-weight: 600; color: var(--violet); }
  .approve .sum { margin: 6px 0; font-size: 13.5px; }
  .approve .frow { display: flex; gap: 8px; margin: 6px 0; flex-wrap: wrap; align-items: center; }
  .approve select, .approve input { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .approve input { flex: 1; min-width: 160px; }
  .approve code { display: block; background: #fff; border: 1px dashed #d8cbf2; border-radius: 6px; padding: 5px 8px; margin: 7px 0; word-break: break-all; font-size: 12px; }
  .approve .hint { color: var(--dim); font-size: 12px; }
  details.fold { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin: 10px 0; }
  details.fold summary { cursor: pointer; color: var(--dim); font-size: 12.5px; user-select: none; }
  details.fold[open] summary { color: var(--ink); margin-bottom: 6px; }
  .feed { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; max-height: 320px; overflow-y: auto; }
  .feed .ev { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .feed .ev:last-child { border-bottom: 0; }
  .feed .t { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feed .k { white-space: nowrap; background: var(--dim-bg); color: var(--dim); border-radius: 6px; padding: 0 7px; font-size: 11.5px; }
  .feed .k.start { background: var(--green-bg); color: var(--green); }
  .feed .k.Bash, .feed .k.Write, .feed .k.Edit { background: var(--blue-bg); color: var(--blue); }
  .feed .k.Agent, .feed .k.Task { background: var(--amber-bg); color: var(--amber); }
  .feed .s { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .c { white-space: nowrap; color: var(--dim); font-size: 11.5px; }
  .copy { cursor: pointer; border: 0; background: none; color: var(--blue); padding: 0; font-size: 12px; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .warnline { color: var(--red); font-size: 12.5px; margin: 6px 0; }
  .iconlink { font-size: 12px; white-space: nowrap; }
  footer { color: var(--dim); font-size: 12px; margin-top: 26px; }
  .skcard { max-width: 720px; }
  .skcard .lede { color: var(--dim); font-size: 13px; margin: 4px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>治理看板</h1>
  <nav id="nav"></nav>
  <span class="hspace"></span>
  <span class="chip" id="admission">准入 …</span>
  <span class="chip" id="gate">呈门 …</span>
  <span class="chip" id="conn"><span class="dot" id="connDot"></span><span id="connText">连接 …</span></span>
  <span class="chip" id="generated">—</span>
</header>
<main id="page"></main>

<script>
'use strict';
let latest = null;
let uiVersionSeen = null;

// The SPA is a static page: an open tab keeps running old code after a
// dashboard update. The server stamps the payload with the index.html
// mtime; when it changes we reload once so the board never lies with a
// stale UI.
function maybeReloadOnUiVersion(d) {
  const v = d?.uiVersion;
  if (!v) return;
  if (uiVersionSeen === null) { uiVersionSeen = v; return; }
  if (v !== uiVersionSeen) location.reload();
}

// ---------- shared helpers ----------

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rel = (iso) => {
  if (!iso) return '—';
  const ms = Date.now() - new Date(iso).getTime();
  if (Number.isNaN(ms)) return '—';
  const m = Math.round(ms / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.round(m / 60);
  if (h < 48) return h + ' 小时前';
  return Math.round(h / 24) + ' 天前';
};
const fmt = (iso) => (iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }) : '—');
const viewLink = (p, label) => p
  ? `<a href="/api/file?path=${encodeURIComponent(p)}" target="_blank">${esc(label ?? p)}</a>`
  : '<span style="color:var(--dim)">无</span>';
const HEALTH_LABEL = { active: '进行中', 'awaiting-close': '待收口', zombie: '僵尸会话', finalized: '已收官' };
const UNIT_STATUS_LABEL = {
  accepted: '已写入·验收',
  'pending-approval': '待批准写入',
  executing: '写入中',
  'rolling-back': '回滚中',
  queued: '排队中',
  ungrouped: '未入组',
};
const GATE_LABEL = {
  APPROVE_GROUPING: '批准分组方案',
  APPROVE_WRITES: '批准批次写入',
  APPROVE_DOCUMENT: '批准单篇写入',
  APPROVE_ROLLBACK: '批准回滚',
  APPROVE_ACCEPTANCE: '批准终局验收',
  CLOSE_SESSION: '收口（机械）',
};
const GATE_TO_LINE = {
  APPROVE_WRITE: 'APPROVE_WRITES',
  APPROVE_DOCUMENT: 'APPROVE_DOCUMENT',
  APPROVE_ROLLBACK: 'APPROVE_ROLLBACK',
  APPROVE_ACCEPTANCE: 'APPROVE_ACCEPTANCE',
  APPROVE_GROUPING: 'APPROVE_GROUPING',
};
const APPROVE_LINE_RE = /^APPROVE_(GROUPING|WRITES|DOCUMENT|ROLLBACK|ACCEPTANCE)(?: \S+)? sha256:[a-f0-9]{64}$/;

function copyText(t) { navigator.clipboard?.writeText(t); }
function attachKey(c) { return c.scanState.key || c.sessionPath; }
function cardKey(c) {
  return c.sessionKey
    ?? (c.kind === 'intake' ? `${c.checkout}::${c.manifestPath}` : `main::${c.sessionPath}`);
}
function checkoutChip(c) { return c.checkout && c.checkout !== 'main' ? `<span class="badge" title="${esc(c.checkoutLabel ?? c.checkout)} 工作树">${esc(c.checkoutLabel ?? c.checkout)}</span>` : ''; }
function humanUnit(unitId) { return String(unitId || '').replace(/^review:/, '').replace(/^[a-z]+:/, '').replace(/:/g, '.'); }

// ---------- skills & routes ----------

const SKILLS = [
  { id: 'api', short: 'API 参考', name: 'api-reference-sync', lede: 'SDK / CLI / REST 版本化 API 参考记录同步（本看板主力技能）', hasBoard: true },
  { id: 'localized-doc-sync', short: '本地化对齐', name: 'localized-doc-sync', lede: '源文档与 zh-CN 本地化文档的对齐：记录差异、翻译创建/更新、元数据与父映射同步。' },
  { id: 'procedure-code-sync', short: '示例补齐', name: 'procedure-code-sync', lede: '给 Python 主导的步骤文档补齐 Java / Go / Node / REST / CLI / C++ 等语言代码块（源码核证后插入）。' },
  { id: 'doc-code-verify', short: '代码验证', name: 'doc-code-verify', lede: '对文档中的代码样例做只读验证：语法检查、lint、编译、场景与门控运行；修复另行立项。' },
  { id: 'verified-doc-authoring', short: '验证式起草', name: 'verified-doc-authoring', lede: '从混合参考资料起草或大幅修订文档，主张先对源码验证，未决主张保持可见。' },
];

function parseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/home';
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'home' || parts.length === 0) return { name: 'home' };
  if (parts[0] === 'skill' && parts[1] === 'api' && parts[2] === 'lang' && parts[3]) return { name: 'lang', lang: parts[3] };
  if (parts[0] === 'skill' && parts[1] === 'api' && parts[2] === 'track' && parts[3]) return { name: 'track', key: parts[3] };
  if (parts[0] === 'skill' && parts[1] === 'api') return { name: 'skill-api' };
  if (parts[0] === 'skill' && parts[1]) return { name: 'skill', id: parts.slice(1).join('/') };
  if (parts[0] === 'campaign' && parts[1]) return { name: 'campaign', path: parts.slice(1).join('/') };
  return { name: 'home' };
}

function navActive(route) {
  if (route.name === 'home') return 'home';
  if (route.name === 'skill-api' || route.name === 'lang' || route.name === 'track') return 'api';
  if (route.name === 'skill') return route.id;
  return '';
}

function renderNav(route) {
  const on = navActive(route);
  const links = [`<a href="#/home" class="${on === 'home' ? 'on' : ''}">总览</a>`]
    .concat(SKILLS.map((s) => s.hasBoard
      ? `<a href="#/skill/api" class="${on === 'api' ? 'on' : ''}" title="${esc(s.name)}">${esc(s.short)}</a>`
      : `<a href="#/skill/${esc(s.id)}" class="${on === s.id ? 'on' : ''}" title="${esc(s.name)}">${esc(s.short)}</a>`));
  document.getElementById('nav').innerHTML = links.join('');
}

function crumbs(parts) {
  return `<div class="crumbs">${parts.map((p, i) => (i === parts.length - 1
    ? `<b>${esc(p.label)}</b>`
    : `<a href="${esc(p.href)}">${esc(p.label)}</a> <span>›</span> `)).join('')}</div>`;
}

function campaignHref(c) { return `#/campaign/${encodeURIComponent(cardKey(c))}`; }

// ---------- header ----------

function renderHeader(d) {
  const fp = d.admission && d.admission.fingerprint;
  const adm = document.getElementById('admission');
  if (!fp || fp.status === 'pending') {
    adm.className = 'chip'; adm.textContent = `准入 台账 ${d.admission?.ledgerEntryCount ?? 0} 条 · 指纹计算中…`;
  } else if (fp.matchesLedger === true) {
    adm.className = 'chip ok';
    adm.textContent = `准入 ADMITTED（${fp.phase ?? '?'} · 指纹 ${String(fp.fingerprint ?? '').slice(7, 19)}…）`;
  } else if (fp.matchesLedger === false) {
    adm.className = 'chip bad';
    adm.textContent = `准入 未匹配（台账最新 ${d.admission?.lastEntry?.phase ?? '?'} vs 当前树指纹）`;
  } else {
    adm.className = 'chip'; adm.textContent = `准入 台账 ${d.admission?.ledgerEntryCount ?? 0} 条（无指纹比对）`;
  }
  const gate = document.getElementById('gate');
  const present = (d.gatePresentations || []).filter((g) => g.present);
  if (present.length === 1) {
    gate.className = 'chip warn';
    gate.innerHTML = `<a href="/api/file?path=${encodeURIComponent(present[0].path)}" target="_blank">呈门材料待审（${esc(present[0].label)}）→</a>`;
  } else if (present.length > 1) {
    gate.className = 'chip warn';
    gate.innerHTML = `<a href="/api/file?path=${encodeURIComponent(present[0].path)}" target="_blank">呈门材料待审 ×${present.length} →</a>`;
  } else {
    gate.className = 'chip'; gate.textContent = '呈门 无待审';
  }
  document.getElementById('generated').textContent = '生成于 ' + fmt(d.generatedAt);
}

// ---------- home ----------

function gateSummary(c) {
  const gate = c.nextGate?.gate;
  if (!gate) return null;
  if (gate === 'CLOSE_SESSION') return { title: '待收口', detail: '全部单元已接受，差机械收口（close-session）' };
  const label = GATE_LABEL[GATE_TO_LINE[gate] || gate] || gate;
  const unit = c.nextGate?.reviewUnitId;
  return { title: label, detail: unit ? `《${humanUnit(unit)}》` : (c.pending ? `${c.pending} 篇挂起` : '') };
}

function renderInbox(d) {
  const items = [];
  for (const c of d.campaigns || []) {
    if (c.health === 'finalized') continue;
    const g = gateSummary(c);
    if (!g) continue;
    items.push({
      t: `${c.language ?? '?'} ${c.track ?? ''} 战役 · ${g.title}`,
      d2: `${g.detail} · 进度 ${c.accepted}/${c.units}`,
      href: campaignHref(c),
      go: '去处理',
    });
  }
  for (const s of d.sentinels || []) {
    if (s.report?.present && s.report.hasFindings) {
      items.push({
        t: `${s.title}：今日有发现`,
        d2: `结论原文「${s.report.conclusion ?? '见报告'}」——待你决定是否立项处理`,
        href: `/api/file?path=${encodeURIComponent(s.report.path)}`,
        external: true,
        go: '看报告',
      });
    }
  }
  for (const i of (d.intakes || []).filter((x) => !x.approved)) {
    items.push({
      t: `分组门待批：${i.title}`,
      d2: `${i.checkoutLabel} · ${rel(i.presentedAt)} 呈门 · digest ${i.digest.slice(7, 19)}…——批准后战役进入筹备（dry-run/建会话）`,
      href: (i.links || []).map((l) => intakeLinkHref(l, d)).find(Boolean) || '#/skill/api',
      external: Boolean((i.links || []).map((l) => intakeLinkHref(l, d)).find(Boolean)),
      go: '打开分组材料',
    });
  }
  for (const g of (d.gatePresentations || []).filter((x) => x.present)) {
    items.push({
      t: `呈门材料待审${(d.gatePresentations || []).filter((x) => x.present).length > 1 ? `（${g.label}）` : ''}`,
      d2: `${g.label} 的战役把审批材料整理成了索引页（写审批预览、live 页、记录链接）`,
      href: `/api/file?path=${encodeURIComponent(g.path)}`,
      external: true,
      go: '打开材料',
    });
  }
  if (!items.length) return '<div class="empty">无待决事项 ✓</div>';
  return `<div class="inbox">${items.map((it) => `
    <div class="item">
      <div class="what"><div class="t">${esc(it.t)}</div><div class="d" title="${esc(it.d2)}">${esc(it.d2)}</div></div>
      ${it.external
        ? `<a class="go ghost" style="text-decoration:none" href="${esc(it.href)}" target="_blank">${esc(it.go)}</a>`
        : `<button class="go" onclick="location.hash='${esc(it.href.replace(/'/g, ''))}'">${esc(it.go)}</button>`}
    </div>`).join('')}</div>`;
}

function renderSentinels(d) {

// ---------- live stats & scout findings (batch 6; client caches, TTL 5min) ----------

let liveCache = { at: 0, data: null };
let scoutCache = { at: 0, data: null };
const CLIENT_CACHE_MS = 5 * 60_000;

async function fetchLive() {
  // A warming snapshot (first sweep still running server-side) caches only
  // briefly so the chip retries and fills in.
  const warming = liveCache.data && liveCache.data.status === 'never-run';
  const ttl = warming ? 15_000 : CLIENT_CACHE_MS;
  if (liveCache.data && Date.now() - liveCache.at < ttl) return liveCache.data;
  try {
    const j = await (await fetch('/api/live-stats')).json();
    liveCache = { at: Date.now(), data: j };
  } catch {
    liveCache = { at: Date.now(), data: { status: 'failed', tracks: {} } };
  }
  return liveCache.data;
}

async function fetchScout() {
  if (scoutCache.data && Date.now() - scoutCache.at < CLIENT_CACHE_MS) return scoutCache.data;
  try {
    const j = await (await fetch('/api/scout')).json();
    scoutCache = { at: Date.now(), data: j };
  } catch {
    scoutCache = { at: Date.now(), data: { ok: false, languages: [] } };
  }
  return scoutCache.data;
}

function liveChipFor(live, language) {
  if (!live || live.status === 'never-run') return '<span class="badge">live 统计拉取中…</span>';
  const tracks = Object.values(live.tracks || {}).filter((t) => t.language === language);
  if (live.status === 'failed' || !tracks.length) {
    return `<span class="badge" title="${esc(live.error ?? '')}">live 拉取失败（registry 静态）</span>`;
  }
  const records = tracks.reduce((n, t) => n + (t.recordTotal ?? 0), 0);
  const docs = tracks.reduce((n, t) => n + (t.docs ?? 0), 0);
  const capped = tracks.some((t) => t.capped);
  return `<span class="badge ${live.status === 'ok' ? 'finalized' : 'active'}" title="实时取自飞书${capped ? '（文档数已按上限截断）' : ''}">live 记录 ${records} · 文档 ${docs}${live.fetchedAt ? ` · ${rel(live.fetchedAt)}` : ''}</span>`;
}

// ---------- campaign table (language page / track page / skill page) ----------

let tableShowFinalized = false;

// Gate-phase campaigns enter the table (three-gate ruling, 2026-10-06): a
// campaign counts from the operator's scan request, and the grouping gate is
// its first gate.
// A gate leaves the gate phase the moment its work is carried by another
// card — decided by DIGEST, not evidence kind: a session campaign bound to
// the proposal (groupingApproval.proposalDigest) or a revision campaign
// linked to the gate manifest (groupingGate.digest) supersedes the gate row.
// Receipts are durable, so evidence alone ('receipt' survives session
// binding forever) would double-render the standard governed flow.
function gatePhaseIntakes(intakes, d) {
  // Checkout-scoped like the ledger's own evidence derivation: a sibling
  // worktree presenting the same digest is a different campaign and must
  // keep its row. Carried gates leave regardless of approval state — one
  // campaign, one row, full stop (closes the pre-first-write window too).
  const carried = new Set();
  for (const c of (d?.campaigns || [])) {
    if (c.groupingApproval?.proposalDigest) carried.add(`${c.checkout}::${c.groupingApproval.proposalDigest}`);
    // Merged revision flows carry their gate inside the campaign card.
    if (c.revisionFlow?.groupingGate?.digest) carried.add(`${c.checkout}::${c.revisionFlow.groupingGate.digest}`);
  }
  for (const r of (d?.revisions || [])) {
    if (r.groupingGate?.digest) carried.add(`${r.checkout}::${r.groupingGate.digest}`);
  }
  return (intakes || []).filter((i) => !carried.has(`${i.checkout}::${i.digest}`)
    && (!i.approved || i.approvalEvidence === 'receipt'));
}

function flowBadge(c) {
  // Stored acceptanceFlow keeps its historical value; the board speaks the
  // three-gate vocabulary — grouping → write → accept.
  const flow = c.acceptanceFlow === 'two-gate' ? 'three-gate' : c.acceptanceFlow;
  return `<span class="badge ${c.acceptanceFlow === 'two-gate' ? 'active' : ''}" title="三门：分组门 → 写门 → 验收门${c.kind === 'intake' ? '；当前处于分组门阶段' : '；分组门已过，写门/验收门在会话内'}">${esc(flow ?? '?')}</span>`;
}

function intakeRow(i) {
  const statusBadge = !i.approved
    ? `<span class="badge gate" title="待你批准：${esc(i.digest)}">分组门待批</span>`
    : '<span class="badge active" title="批准已铸回执——会话/dry-run/context 生成中，下一持久化事件=评审会话落盘">已批 · 筹备中</span>';
  return `<tr class="rowlink" onclick="location.hash='${campaignHref(i).replace(/'/g, '')}'">
    <td><span class="fname">${esc(i.language ?? '?')}</span> ${checkoutChip(i)}</td>
    <td>${flowBadge({ ...i, acceptanceFlow: 'two-gate', kind: 'intake' })}</td>
    <td>${statusBadge}</td>
    <td class="num" style="min-width:90px"><span class="dim">分组阶段</span></td>
    <td>${!i.approved
      ? `<span class="badge gate" title="${esc(i.digest)}">APPROVE_GROUPING</span>`
      : '<span class="dim">写门/验收门在会话内呈</span>'}</td>
    <td class="dim">${rel(i.presentedAt)}</td>
    <td onclick="event.stopPropagation()">${!i.approved
      ? `<button class="act" title="把 APPROVE_GROUPING 批准行放进剪贴板；粘到战役会话即为批复（digest 绑定由治理 CLI 执法）" onclick="copyText(${JSON.stringify(`APPROVE_GROUPING ${i.digest}`).replace(/"/g, '&quot;')})">复制批准行</button>`
      : `<button class="act" title="查看呈门材料索引" onclick="location.hash='${campaignHref(i).replace(/'/g, '')}'">详情</button>`}</td>
  </tr>`;
}

function campaignRows(list, d) {
  return list.map((c) => {
    if (c.kind === 'intake') return intakeRow(c);
    if (c.kind === 'revision') return revisionRow(c);
    const pct = c.units ? Math.round((c.accepted / c.units) * 100) : 0;
    const g = gateSummary(c);
    // Merged revision flow (one campaign, one row): written-page evidence
    // rides under the acceptance bar, and a write-ahead-of-acceptance gap
    // with nothing in flight is the receipt-never-landed alarm — surface it,
    // never bury it in a second row.
    const rf = c.revisionFlow || null;
    const inflight = c.pending > 0 || c.hasActiveExecution;
    const gapBadge = rf && rf.receiptGap > 0
      ? ` <span class="badge ${inflight ? '' : 'gate'}" title="${inflight
        ? `已写页数领先已收单元 ${rf.receiptGap} 个——执行/挂起进行中，属写门先行；收单元后应归零`
        : `已写页数领先已收单元 ${rf.receiptGap} 个且无执行/挂起——疑似回执未落（执行完好、accept 回执缺失），先对账再推进`}">写收差 ${rf.receiptGap}</span>`
      : '';
    const progressCell = `${c.accepted}/${c.units}${gapBadge}<div class="bar" style="margin:2px 0 0"><i style="width:${pct}%"></i></div>${rf
      ? `<div class="dim" style="font-size:11.5px">写门对账：已写 ${rf.writtenPages} 页 · ${esc(rf.worklistStem)}</div>`
      : ''}`;
    const gateCell = g
      ? `<span class="badge gate" title="${esc(c.nextGate?.reviewUnitId || '')}">${esc(g.title)}</span>`
      : rf && rf.groupingGate
        ? `<span class="badge gate" title="${esc(rf.groupingGate.digest)}">分组门已呈（修订流）</span>`
        : '<span class="dim">—</span>';
    return `<tr class="rowlink" onclick="location.hash='${campaignHref(c).replace(/'/g, '')}'">
      <td><span class="fname">${esc(c.track ?? '?')}</span> ${checkoutChip(c)}${c.groupingApproval ? `<span class="badge" title="APPROVE_GROUPING 已绑入会话（${esc(c.groupingApproval.proposalDigest)}）——此后入口 release-scope 摘要对照已批 scope 校验，漂移即拒">已绑分组</span>` : ''}</td>
      <td>${flowBadge(c)}</td>
      <td><span class="badge ${c.health}">${HEALTH_LABEL[c.health] ?? esc(c.status)}</span></td>
      <td class="num" style="min-width:120px">${progressCell}</td>
      <td>${gateCell}</td>
      <td class="dim">${rel(c.updatedAt)}</td>
      <td onclick="event.stopPropagation()"><button class="act" title="把 /attach 战役键放进剪贴板；粘到新 ZCode 会话即接手本战役" onclick="copyText('/attach ${esc(attachKey(c))}')">复制挂载命令</button></td>
    </tr>`;
  }).join('');
}

// Revision campaigns share the campaign table: same columns, adapted cells.
function revisionRow(r) {
  const pct = r.scope.pages ? Math.round((r.writtenPages / r.scope.pages) * 100) : 0;
  const writtenSet = r.written.map((w) => w.unit);
  const writtenHit = (page) => writtenSet.some((u) => u.includes('-' + page));
  return `<tr class="rowlink" onclick="location.hash='${campaignHref(r).replace(/'/g, '')}'">
    <td><span class="fname">${esc(r.language ?? '?')}</span> ${checkoutChip(r)}</td>
    <td><span class="badge gate">revision</span></td>
    <td><span class="badge ${r.status === 'finalized' ? 'finalized' : 'active'}">${r.status === 'finalized' ? '已收官' : '进行中'}</span></td>
    <td class="num" style="min-width:90px">${r.writtenPages}/${r.scope.pages}<div class="bar" style="margin:2px 0 0"><i style="width:${pct}%"></i></div></td>
    <td>${r.status === 'finalized'
      ? '<span class="dim">—</span>'
      : r.groupingApproved
        ? `<span class="badge gate" title="逐页写门由执行会话内呈（digest 见会话/呈门材料）；与三门流程的 APPROVE_WRITES 同一批准形态">批准批次写入</span>`
        : r.groupingGate
          ? `<span class="badge gate" title="待你批准：${esc(r.groupingGate.digest)}">分组门待批</span>`
          : '<span class="dim">—</span>'}</td>
    <td class="dim">${rel(r.updatedAt)}</td>
    <td onclick="event.stopPropagation()"><button class="act" title="把 /attach 工作单键放进剪贴板；粘到新 ZCode 会话即接手本修订战役" onclick="copyText('/attach ${esc(r.worklistStem)}')">复制挂载命令</button></td>
  </tr>`;
}

function campaignTable(list, d, { empty = '无战役' } = {}) {
  if (!list.length) return `<div class="empty">${esc(empty)}</div>`;
  const finalized = list.filter((c) => c.health === 'finalized');
  const live = list.filter((c) => c.health !== 'finalized');
  const showFinal = tableShowFinalized;
  return `
    <table class="tbl">
      <thead><tr><th>轨道</th><th>类型</th><th>状态</th><th>进度</th><th>当前门</th><th>更新</th><th>操作</th></tr></thead>
      <tbody>
        ${campaignRows(live, d)}
        ${showFinal ? campaignRows(finalized, d) : ''}
      </tbody>
    </table>
    ${finalized.length && !showFinal
      ? `<div class="filters" style="margin-top:8px"><span class="f" onclick="tableShowFinalized=true;route()">显示已收官（${finalized.length}）</span></div>`
      : ''}
    ${showFinal && finalized.length
      ? `<div class="filters" style="margin-top:8px"><span class="f" onclick="tableShowFinalized=false;route()">收起已收官</span></div>`
      : ''}`;
}

// ---------- campaign detail ----------

let detailCache = { path: null, sig: '', detail: null };

function detailSignature(c) {
  return JSON.stringify([c?.updatedAt, c?.accepted, c?.pending, c?.nextGate?.gate ?? null, (c?.workers || []).map((w) => w.status).join(',')]);
}

async function fetchDetail(c) {
  const sig = detailSignature(c);
  if (detailCache.path === cardKey(c) && detailCache.sig === sig && detailCache.detail) return detailCache.detail;
  try {
    const r = await fetch(`/api/campaign?path=${encodeURIComponent(cardKey(c))}`);
    const j = await r.json();
    if (!j.ok) return null;
    detailCache = { path: cardKey(c), sig, detail: j };
    return j;
  } catch {
    return null;
  }
}

async function spawnSession(target) {
  try {
    const r = await fetch('/api/spawn-session', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ target }),
    });
    const j = await r.json();
    alert(j.note || j.error || JSON.stringify(j));
  } catch (e) { alert('派出会话失败: ' + e); }
}

async function submitApprove(target, sessionId, line) {
  if (!confirm('确认把这条批准行注入 worker 会话？\n\n' + line)) return;
  try {
    const r = await fetch('/api/approve', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ target, sessionId, line }),
    });
    const j = await r.json();
    alert(j.note || j.error || JSON.stringify(j));
    refreshDetail();
  } catch (e) { alert('批准失败: ' + e); }
}

function refreshDetail() {
  fetch('/api/cards').then((x) => x.json()).then((d) => { latest = d; route(); }).catch(() => {});
}

function approveLinePreview() {
  const gateEl = document.getElementById('apGate');
  if (!gateEl) return;
  const gate = gateEl.value;
  const unit = document.getElementById('apUnit').value.trim();
  const digest = document.getElementById('apDigest').value.trim();
  const line = `${gate}${unit ? ' ' + unit : ''} ${digest || 'sha256:<digest>'}`;
  document.getElementById('apPreview').textContent = line;
  document.getElementById('apSubmit').disabled = !APPROVE_LINE_RE.test(line);
}

function advancedApproveForm(c) {
  const enabled = Boolean(latest && latest.features && latest.features.approveEnabled);
  const workers = (c.workers || []).filter((w) => w.sessionId);
  if (!enabled || !workers.length) return '';
  const gate = GATE_TO_LINE[c.nextGate?.gate] || 'APPROVE_WRITES';
  const unit = c.nextGate?.reviewUnitId || '';
  const pending = (c.pendingUnits || []).find((p) => !unit || p.reviewUnitId === unit);
  const digest = pending?.executionJournalDigest || '';
  const workerSel = workers.map((w) => `<option value="${esc(w.sessionId)}" ${w.status === 'idle' ? 'selected' : 'disabled'}>${esc(w.sessionId.slice(0, 18))}…（${w.status === 'idle' ? '可注入' : '运行中'}）</option>`).join('');
  return `<details class="fold"><summary>高级表单：手组批准行（其余门的 digest 从呈门材料复制）</summary>
    <div class="approve">
      <div class="frow">
        <select id="apGate" onchange="approveLinePreview()">
          ${['APPROVE_GROUPING', 'APPROVE_WRITES', 'APPROVE_DOCUMENT', 'APPROVE_ROLLBACK', 'APPROVE_ACCEPTANCE'].map((g) => `<option ${g === gate ? 'selected' : ''}>${g}</option>`).join('')}
        </select>
        <select id="apWorker">${workerSel}</select>
      </div>
      <div class="frow"><input id="apUnit" placeholder="review-unit-id（DOCUMENT/ROLLBACK 需要）" value="${esc(unit)}" oninput="approveLinePreview()"></div>
      <div class="frow"><input id="apDigest" placeholder="sha256:<digest>（从呈门材料复制；DOCUMENT 有预填）" value="${esc(digest)}" oninput="approveLinePreview()"></div>
      <code id="apPreview"></code>
      <button class="act danger" id="apSubmit" onclick="submitApproveFromForm()">注入批准行</button>
      <div class="hint">语义与 digest 绑定由 canonical CLI 的 L1 门禁执法；worker 运行中时不可注入。</div>
    </div>
  </details>`;
}

function submitApproveFromForm() {
  const c = latest.campaigns.find((x) => cardKey(x) === window._detailPath || x.sessionPath === window._detailPath);
  const worker = document.getElementById('apWorker').value;
  submitApprove(window._detailPath, worker, document.getElementById('apPreview').textContent);
}

function oneClickApproveCard(c, detail) {
  const feats = latest?.features || {};
  if (!feats.approveEnabled) {
    return `<div class="approve"><div class="t">⛩ 界面批准未开启</div><div class="hint">启动看板时加 <code>--allow-approve</code> 后，这里可以一键批准看板派出的会话。</div></div>`;
  }
  const workers = (c.workers || []).filter((w) => w.sessionId);
  if (!workers.length) {
    const g0 = gateSummary(c);
    const lineGate0 = GATE_TO_LINE[c.nextGate?.gate] || 'APPROVE_WRITES';
    const unit0 = c.nextGate?.reviewUnitId || '';
    const pending0 = (c.pendingUnits || []).find((p) => !unit0 || p.reviewUnitId === unit0);
    const line0 = pending0 ? `${lineGate0}${unit0 ? ' ' + unit0 : ''} ${pending0.executionJournalDigest}`.trim() : null;
    return `<div class="approve"><div class="t">⛩ ${g0 ? esc(g0.title) : '界面批准'}</div>
      ${line0 && APPROVE_LINE_RE.test(line0)
        ? `<div class="frow"><code>${esc(line0)}</code><button class="act primary" onclick="copyText(${JSON.stringify(line0).replace(/"/g, '&quot;')})">复制批准行</button></div>`
        : `<div class="hint">当前门或 digest 尚不可自动组装（约 1 分钟刷新；或从呈门材料取精确行）。</div>`}
      <div class="hint">无看板 worker：界面注入仅限看板派出的会话（防并发写）。手开的会话把上面的批准行原文粘进去即为批复；或用「一键派出执行会话」派一个可注入的 worker。</div></div>`;
  }
  const idle = workers.find((w) => w.status === 'idle');
  const g = gateSummary(c);
  if (!g || !c.nextGate) {
    return `<div class="approve"><div class="t">⛩ 当前无待批准的门</div><div class="hint">下一门由治理 CLI 推导（约 1 分钟刷新）；机械收口 CLOSE_SESSION 在会话里跑 close-session 命令。</div></div>`;
  }
  const gate = c.nextGate.gate;
  if (gate === 'CLOSE_SESSION') {
    return `<div class="approve"><div class="t">⛩ 收口</div><div class="sum">全部单元已接受——在会话里执行 <code>close-session</code> 机械收口（不属批准行）。</div></div>`;
  }
  const lineGate = GATE_TO_LINE[gate] || gate;
  const unit = c.nextGate.reviewUnitId || '';
  const pending = (c.pendingUnits || []).find((p) => !unit || p.reviewUnitId === unit);
  const digest = pending?.executionJournalDigest || '';
  const fileRow = unit && detail
    ? (detail.files || []).find((f) => f.unitId === unit || f.unitId === `review:${unit}` || f.stableId === unit)
    : null;
  const summary = lineGate === 'APPROVE_DOCUMENT'
    ? `批准《${humanUnit(unit)}》写入落盘${fileRow?.fileName ? `（${esc(fileRow.fileName)}）` : ''}`
    : lineGate === 'APPROVE_WRITES'
      ? `批准批次写入（挂起 ${c.pending} 篇）`
      : lineGate === 'APPROVE_GROUPING'
        ? `批准分组方案（共 ${c.units} 个写作单元）`
        : lineGate === 'APPROVE_ROLLBACK'
          ? `批准回滚 ${esc(unit || '（填单元 id）')}`
          : '批准终局验收';
  const line = `${lineGate}${unit ? ' ' + unit : ''} ${digest}`.trim();
  const manualCopy = (reason) => `<div class="approve"><div class="t">⛩ ${esc(g.title)}</div><div class="sum">${summary}</div>
    ${digest && APPROVE_LINE_RE.test(line)
      ? `<div class="frow"><code>${esc(line)}</code><button class="act primary" onclick="copyText(${JSON.stringify(line).replace(/"/g, '&quot;')})">复制批准行</button></div>`
      : `<div class="hint">这一门的 digest 不能自动预填——从<a href="/api/file?path=${encodeURIComponent('tmp/api-reference-sync/gate-presentation/latest.html')}" target="_blank">呈门材料</a>复制精确行。</div>`}
    <div class="hint">${esc(reason)}：界面注入仅限看板派出的会话（防并发写）；手开的会话把上面这行原文粘进去即为批复——语义与 digest 绑定仍由治理 CLI 执法。</div></div>`;
  if (!idle) {
    return `<div class="approve"><div class="t">⛩ ${esc(g.title)}</div><div class="sum">${summary}</div><div class="hint">worker 正在运行——等它停在门禁后再批准。</div></div>`;
  }
  if (!digest || !APPROVE_LINE_RE.test(line)) {
    return `<div class="approve"><div class="t">⛩ ${esc(g.title)}</div><div class="sum">${summary}</div><div class="hint">这一门的 digest 不能自动预填——从<a href="/api/file?path=${encodeURIComponent('tmp/api-reference-sync/gate-presentation/latest.html')}" target="_blank">呈门材料</a>复制后，用下方高级表单注入。</div></div>`;
  }
  return `<div class="approve">
    <div class="t">⛩ ${esc(g.title)} — 等你一句话</div>
    <div class="sum">${summary}</div>
    <details class="fold" style="margin:6px 0"><summary>技术详情（批准行与绑定摘要）</summary><code>${esc(line)}</code><div class="hint">worker：${esc(idle.sessionId)} · 注入方式 --resume 原文转发，语义校验在治理 CLI。</div></details>
    <button class="act primary" onclick="submitApprove(${JSON.stringify(cardKey(c)).replace(/"/g, '&quot;')}, ${JSON.stringify(idle.sessionId).replace(/"/g, '&quot;')}, ${JSON.stringify(line).replace(/"/g, '&quot;')})">批准并继续</button>
  </div>`;
}

function stepChips(c) {
  const total = c.units || 0;
  const done = c.health === 'finalized';
  const steps = [
    { label: '发现', state: 'done' },
    { label: '分组', state: total > 0 ? 'done' : 'cur' },
    {
      label: `写入·验收 ${c.accepted}/${total}`,
      state: done || (total > 0 && c.accepted >= total) ? 'done' : (c.accepted > 0 ? 'cur' : 'todo'),
    },
    { label: '收口', state: done ? 'done' : (total > 0 && c.accepted >= total ? 'cur' : 'todo') },
  ];
  return `<div class="steps">${steps.map((s, i) => `${i ? '<span class="arr">›</span>' : ''}<span class="st ${s.state}">${s.state === 'done' ? '✓ ' : ''}${esc(s.label)}</span>`).join('')}</div>`;
}

function filesTable(detail) {
  const files = (detail?.files || []).slice();
  const order = { 'pending-approval': 0, executing: 1, 'rolling-back': 2, queued: 3, accepted: 4, ungrouped: 5 };
  files.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
  if (!files.length) return '<div class="empty">无文件表（releaseScope 工件缺失或无单元）</div>';
  const anyPrFile = files.some((f) => f.filePath);
  const rows = files.map((f) => `<tr>
      <td class="fname" title="${esc(f.filePath ?? '')}">${esc(f.fileName ?? f.symbol ?? humanUnit(f.unitId))}${(!f.filePath && anyPrFile) ? ' <span class="dim">（无 PR 文件，源码证据）</span>' : ''}</td>
      <td>${f.unitId ? `<span class="iconlink" title="${esc(f.unitId)}">${esc(humanUnit(f.unitId))}</span>` : '<span class="dim">—</span>'}</td>
      <td>${f.status === 'accepted' ? '<span class="badge finalized">已写入·验收</span>' : f.status === 'pending-approval' ? '<span class="badge gate">待批准写入</span>' : f.status === 'ungrouped' ? '<span class="badge">未入组</span>' : `<span class="badge active">${esc(UNIT_STATUS_LABEL[f.status] ?? f.status)}</span>`}</td>
      <td class="dim">${esc(f.reason ?? '—')}</td>
      <td class="dim num" title="${esc(f.sourceLocator ?? '')}">${f.sourcePr ? `PR #${f.sourcePr}` : (f.sourceLocator ?? f.changeType ?? '—')}</td>
      <td class="iconlink">${f.documentLinks?.length ? `<a href="${esc(f.documentLinks[0])}" target="_blank" title="${esc(f.documentLinks[0])}">文档</a>` : ''}${f.recordLinks?.length ? ` <a href="${esc(f.recordLinks[0])}" target="_blank" title="${esc(f.recordLinks[0])}">记录</a>` : ''}${(f.documentLinks?.length || f.recordLinks?.length) ? '' : (f.status === 'accepted' || f.status === 'ungrouped' ? '<span class="dim">—</span>' : '<span class="dim" title="文档/记录链接由该单元的验收回执携带">待写入后生成</span>')}</td>
    </tr>`).join('');
  return `<table class="tbl">
    <thead><tr><th>文件</th><th>单元</th><th>状态</th><th>变更原因</th><th>来源</th><th>飞书</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="note" style="border:0">${anyPrFile
    ? '文件名取自 release-scope 的 web-content 路径；悬停看全路径。「飞书」列链接由<b>已写入·验收单元的回执</b>携带——未写入的单元显示"待写入后生成"。'
    : '本次范围为<b>源码证据驱动</b>（无 web-content PR 文件）：首列为方法/单元名，「来源」列为 SDK 源码定位（仓库 file:line）。「飞书」列链接由已写入·验收单元的回执携带。'}</div>`;
}

function fmtTokens(n) {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'k';
  return String(n);
}

async function renderUsagePanel(c) {
  const host = document.getElementById('usageHost');
  if (!host) return;
  try {
    const u = await (await fetch(`/api/usage?path=${encodeURIComponent(cardKey(c))}`)).json();
    if (!u.available) {
      host.innerHTML = `<div class="empty">token 采集不可用（${esc(u.reason ?? '')}）</div>`;
      return;
    }
    const t = u.totals;
    if (!t.sessions) {
      host.innerHTML = '<div class="empty">尚无本战役的 token 采集（采集自看板批 7 上线起；历史战役无数据）</div>';
      return;
    }
    const sessRows = u.sessions.map((s) => `<tr>
        <td class="fname" title="${esc(s.sessionId)}">${esc(String(s.sessionId).slice(0, 20))}…</td>
        <td class="dim">${esc(s.source ?? '—')}</td>
        <td class="num">${s.turns ?? '—'}</td>
        <td class="num">${fmtTokens(s.inputTokens)}</td>
        <td class="num">${fmtTokens(s.outputTokens)}</td>
        <td class="num">${fmtTokens(s.totalTokens)}</td>
        <td class="dim">${rel(s.lastTs ?? s.lastSeenAt)}</td>
      </tr>`).join('');
    const unitRows = u.perUnit.length
      ? u.perUnit.map((p) => `<tr>
          <td class="fname">${esc(humanUnit(p.unitId))}</td>
          <td class="num">${p.runs}</td>
          <td class="num">${fmtTokens(p.input)}</td>
          <td class="num">${fmtTokens(p.output)}</td>
          <td class="num">${fmtTokens(p.total)}</td>
          <td class="dim">${p.lastAt ? rel(p.lastAt) : '—'}</td>
        </tr>`).join('')
      : '<tr><td colspan="6" class="dim" style="text-align:center;padding:12px">暂无看板批准回合的逐篇归因（经界面批准的回合才会记到单篇）</td></tr>';
    host.innerHTML = `
      <div class="card" style="cursor:default;margin-bottom:12px">
        <div class="row1">
          <span class="title">战役总计 <span style="color:var(--blue)">${fmtTokens(t.totalTokens)}</span> tokens</span>
          <span class="meta"><span>输入 ${fmtTokens(t.inputTokens)}</span><span>输出 ${fmtTokens(t.outputTokens)}</span><span>缓存读 ${fmtTokens(t.cacheRead)}</span><span>缓存写 ${fmtTokens(t.cacheWrite)}</span><span>会话 ${t.sessions}</span></span>
        </div>
        <div class="note" style="border:0">采集${u.collectedSince ? `始于 ${fmt(u.collectedSince)}` : '中'}；宿主会清理原始转录，看板每 2 分钟增量落库。人工会话回合计入战役级、无法精确到单篇（如实呈现，不做估算）。</div>
      </div>
      <table class="tbl">
        <thead><tr><th>会话</th><th>归因来源</th><th>回合</th><th>输入</th><th>输出</th><th>合计</th><th>最近</th></tr></thead>
        <tbody>${sessRows}</tbody>
      </table>
      <h2>逐篇写作消耗（看板批准回合）</h2>
      <table class="tbl">
        <thead><tr><th>单元</th><th>回合数</th><th>输入</th><th>输出</th><th>合计</th><th>最近</th></tr></thead>
        <tbody>${unitRows}</tbody>
      </table>`;
  } catch {
    host.innerHTML = '<div class="empty">token 数据载入失败</div>';
  }
}

      ${c.health === 'zombie' ? `<div class="warnline">⚠ 僵尸会话：scan-state 已推进到 ${esc(c.scanState.lastScannedTag ?? '?')}（越过目标 ${esc(c.scanState.targetTag ?? '?')}）——close-session 收口，勿续跑。</div>` : ''}
      <div class="actions" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="act" title="把 /attach 战役键放进剪贴板；粘到新 ZCode 会话即接手本战役" onclick="copyText('/attach ${esc(attachKey(c))}')">复制挂载命令</button>
        ${spawnOn ? `<button class="act" title="免终端：在 ZCode 桌面端生成带简报的新会话并自动开工，遇门禁停下等你" onclick="spawnSession(${JSON.stringify(cardKey(c)).replace(/"/g, '&quot;')})">一键派出执行会话</button>` : ''}
      </div>
    </div>
    ${oneClickApproveCard(c, null)}
    ${advancedApproveForm(c)}
    <h2>规模</h2>
    <div class="card" style="cursor:default"><div class="kv" id="scaleKv" style="margin-top:0">
      <b>写作单元</b><span>${c.accepted}/${c.units} 已接受 · 挂起 ${c.pending}${c.changeRequests?.entries ? ` · 打回记录 ${c.changeRequests.entries} 条（未收 ${c.changeRequests.units} 单元）` : ''}</span>
      <b>scan-state</b><span>${esc(c.scanState.key ?? '—')}${c.scanState.lastScannedTag ? ` @ ${esc(c.scanState.lastScannedTag)}` : ''}（会话目标 ${esc(c.scanState.targetTag ?? '—')}）</span>
      ${c.groupingApproval?.proposalDigest ? `<b>分组绑定</b><span class="badge finalized" title="提案 ${esc(c.groupingApproval.proposalDigest)} · 已批 scope ${esc(c.groupingApproval.scopeDigest ?? '—')} · 批准于 ${esc(c.groupingApproval.approvedAt ?? '—')}——入口 release-scope 漂移即拒（GROUPING_STALE）">APPROVE_GROUPING 已绑 · ${esc(c.groupingApproval.proposalDigest.slice(7, 19))}…</span>` : '<b>分组绑定</b><span class="dim">未绑定（旧流程会话或分组门未走回执）</span>'}
    </div></div>
    ${c.revisionFlow ? `<h2>修订流（同一战役的写门对账）</h2>
    <div class="card" style="cursor:default"><div class="kv" style="margin-top:0">
      <b>工作单</b><span>${viewLink(c.revisionFlow.worklistPath, c.revisionFlow.worklistPath)}（${esc(c.revisionFlow.scope.findings)} 项发现 / 唯一页 ${c.revisionFlow.scope.uniquePages}）</span>
      <b>范围</b><span>${c.revisionFlow.scope.pages} 页 · scope 工件 ${c.revisionFlow.scopePath ? viewLink(c.revisionFlow.scopePath, c.revisionFlow.scopePath.split('/').pop()) : '未链接'}</span>
      <b>已写</b><span>${c.revisionFlow.writtenPages} 页 · 剩约 ${c.revisionFlow.remainingPages}${c.revisionFlow.receiptGap > 0 ? ` · <span class="badge gate" title="已写页数领先已收单元 ${c.revisionFlow.receiptGap} 个——执行/挂起为零时即回执未落，先对账">写收差 ${c.revisionFlow.receiptGap}</span>` : ''}</span>
      <b>分组门</b><span>${c.revisionFlow.groupingGate ? `${esc(c.revisionFlow.groupingGate.digest)} · ${viewLink(c.revisionFlow.groupingGate.manifest, 'manifest')}` : '未见分组门 manifest'}</span>
      ${c.revisionFlow.written.length ? `<details class="fold" style="grid-column:1/-1"><summary>已写页面（run-manifest 对账，${c.revisionFlow.writtenPages}）</summary><ul style="margin:4px 0;padding-left:18px">${c.revisionFlow.written.map((w) => `<li>${esc(w.unit)}（${esc(w.flow)}）· ${viewLink(w.manifest, 'manifest')}</li>`).join('')}</ul></details>` : ''}
    </div></div>` : ''}
    <h2>文件清单（按单元分组，文件名为主）</h2>
    <div id="filesHost"><div class="empty">载入中…</div></div>
    <h2>token 消耗</h2>
    <div id="usageHost"><div class="empty">载入中…</div></div>
    <details class="fold"><summary>工件与执行 journal（治理原始材料）</summary>
      <ul style="margin:6px 0;padding-left:18px">
        <li>releaseScope: ${viewLink(c.artifacts.releaseScope)}</li>
        <li>referenceContext: ${viewLink(c.artifacts.referenceContext)}</li>
        <li>summaryJson: ${viewLink(c.artifacts.summaryJson)}</li>
        ${c.journalPaths.map((p) => `<li>journal: ${viewLink(p)}</li>`).join('')}
        <li>会话文件: ${viewLink(c.sessionPath, c.sessionPath)}</li>
      </ul>
    </details>`;
  approveLinePreview();
  const detail = await fetchDetail(c);
  const scaleKv = document.getElementById('scaleKv');
  if (scaleKv && detail?.ok) {
    scaleKv.insertAdjacentHTML('beforeend', `
      <b>变更动作</b><span>${detail.scale.actions ?? '—'} 个 · PR 文件 ${detail.scale.prFiles ?? '—'} 个${detail.scale.changedSdkFiles != null ? ` · SDK 源码变更 ${detail.scale.changedSdkFiles} 个` : ''}</span>
      <b>版本区间</b><span>${esc(detail.scale.baselineTag ?? '—')} → ${esc(detail.scale.targetTag ?? '—')}</span>`);
  }
  const filesHost = document.getElementById('filesHost');
  if (filesHost) filesHost.innerHTML = filesTable(detail);
  const approveHost = document.querySelector('.approve');
  if (approveHost) approveHost.outerHTML = oneClickApproveCard(c, detail);
  renderUsagePanel(c);
}

// ---------- UI state across re-renders ----------
//
// Card payloads push whenever tmp/ changes (active campaigns write
// constantly), and each render replaces the page's innerHTML — expanded
// details, select choices, typed inputs and scroll positions must survive.

function snapshotUiState() {
  const state = { details: new Set(), selects: {}, inputs: {}, scrollY: 0 };
  document.querySelectorAll?.('details[open] > summary').forEach((sm) => {
    const key = (sm.textContent || '').trim();
    if (key) state.details.add(key);
  });
  document.querySelectorAll?.('select[id], input[id]').forEach((node) => {
    if (node.tagName === 'SELECT') state.selects[node.id] = node.value;
    else state.inputs[node.id] = node.value;
  });
  state.scrollY = typeof window.scrollY === 'number' ? window.scrollY : 0;
  return state;
}

function restoreUiState(state) {
  if (!state) return;
  document.querySelectorAll?.('details > summary').forEach((sm) => {
    if (state.details.has((sm.textContent || '').trim())) sm.parentElement.open = true;
  });
  for (const [id, value] of Object.entries(state.selects || {})) {
    const node = document.getElementById(id);
    if (node) node.value = value;
  }
  for (const [id, value] of Object.entries(state.inputs || {})) {
    const node = document.getElementById(id);
    if (node && document.activeElement !== node) node.value = value;
  }
  if (state.scrollY && typeof window.scrollTo === 'function') window.scrollTo(0, state.scrollY);
}

// ---------- router ----------

function route() {
  if (!latest) return;
  maybeReloadOnUiVersion(latest);
  const uiState = snapshotUiState();
  const r = parseHash();
  renderNav(r);
  renderHeader(latest);
  const d = latest;
  if (r.name === 'home') pageHome(d);
  else if (r.name === 'skill-api') pageSkillApi(d);
  else if (r.name === 'lang') pageLang(d, r.lang);
  else if (r.name === 'track') pageTrack(d, r.key);
  else if (r.name === 'campaign') pageCampaign(d, r.path);
  else if (r.name === 'skill') pageSkill(d, r.id);
  restoreUiState(uiState);
}
window.route = route;
window.addEventListener('hashchange', route);

function connect() {
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  const es = new EventSource('/api/events');
  es.addEventListener('cards', (e) => {
    dot.className = 'dot live'; text.textContent = '实时';
    try { latest = JSON.parse(e.data); route(); } catch {}
  });
  es.onopen = () => { dot.className = 'dot live'; text.textContent = '实时'; };
  es.onerror = () => { dot.className = 'dot dead'; text.textContent = '断开（轮询兜底）'; };
}
connect();
setInterval(async () => {
  try { latest = await (await fetch('/api/cards')).json(); route(); } catch {}
}, 30000);
fetch('/api/cards').then((r) => r.json()).then((d) => { latest = d; route(); }).catch(() => {});
</script>
