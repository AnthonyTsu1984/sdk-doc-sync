# deploy/deployment-python.yaml — python-worker（S2 双 pod 之一）。
#
# 单容器 node:22-bookworm；bootstrap 前台跑完 exec supervisor（见 deploy/bootstrap.sh）。
# slot 表：TRACKS 顺序即 slot 1..N —— slot 1 = v3.0.x（scanStateKey python-v3），
# slot 2 = v2.6.x（scanStateKey python）。BASE_TOKEN 由 bootstrap 解析
# .claude/skills/api-reference-sync/config/release-tracks.json 自动导出 per-track env，
# 无需操作员手工补（该注册表机器可读、每轨带 bitable.baseToken）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-worker
  namespace: sdk-doc-sync
  labels:
    app.kubernetes.io/part-of: sdk-doc-sync
    app.kubernetes.io/name: python-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-worker
        app.kubernetes.io/part-of: sdk-doc-sync
    spec:
      containers:
        - name: worker
          image: node:22-bookworm
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/scripts/bootstrap.sh"]
          workingDir: /workspace
          env:
            - name: LANGUAGE
              value: python
            - name: SDK_REPO
              value: pymilvus
            - name: TRACKS
              value: "v3.0.x,v2.6.x"
            - name: OPENCODE_PROVIDER_KEY
              value: custom
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: sdk-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: scripts
              mountPath: /opt/scripts
              readOnly: true
            - name: backlog
              mountPath: /opt/backlog
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-python
        - name: scripts
          configMap:
            name: sdk-scripts
            defaultMode: 0755
        - name: backlog
          configMap:
            name: sdk-backlog
